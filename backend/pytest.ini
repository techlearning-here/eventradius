[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not manual"
markers =
    unit: Unit tests
    integration: Integration tests (mocked)
    manual: Manual integration tests - excluded from CI by default (requires running backend + real DB)
    auth: Authentication tests
    api: API tests

# To run manual tests: pytest tests/manual_IT/ -v -m manual
# CI uses addopts to exclude manual tests automatically
