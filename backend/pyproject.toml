[project]
name = "eventradius-backend"
version = "0.1.0"
description = "EventRadius backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "python-multipart==0.0.20",
    "supabase==2.25.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "flake8==7.1.1",
    "isort==6.0.1",
    "pre-commit==3.8.0",
    "detect-secrets==1.4.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["api", "config"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.setuptools]
packages = ["api", "config"]

[tool.uv]
