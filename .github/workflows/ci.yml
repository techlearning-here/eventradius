
name: CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml
    secrets: inherit

  frontend-checks:
    uses: ./.github/workflows/frontend-checks.yml
    secrets: inherit